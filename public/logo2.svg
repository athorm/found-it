<svg width="100%" height="100%" viewBox="-150 -150 991 1005" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- Glow filter -->
  <filter id="glowFilter" x="-50%" y="-50%" width="200%" height="200%">
    <!-- Flood with the dark orange color to make the glow consistent -->
    <feFlood flood-color="#ea580c" result="flood" />
    <!-- Mask the solid color to the shape of the logo -->
    <feComposite in="flood" in2="SourceGraphic" operator="in" result="coloredSource" />
    
    <!-- Apply thick blurs to the colored silhouette to create the bloom -->
    <feGaussianBlur in="coloredSource" stdDeviation="15" result="blur1" />
    <feGaussianBlur in="coloredSource" stdDeviation="30" result="blur2" />
    <feGaussianBlur in="coloredSource" stdDeviation="60" result="blur3" />
    <feMerge>
      <feMergeNode in="blur3" />
      <feMergeNode in="blur2" />
      <feMergeNode in="blur2" />
      <feMergeNode in="blur1" />
    </feMerge>
  </filter>

